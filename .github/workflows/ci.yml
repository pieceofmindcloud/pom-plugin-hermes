name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build UI assets
        shell: bash
        run: scripts/build-ui.sh
      - name: Rust checks
        run: cargo test --locked && cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings
        env:
          POM_UI_REQUIRE_DIST: '1'
      - name: Dashboard bridge tests
        run: python -m unittest discover -s tests -p 'test_runtime.py'
      - name: Release plan
        if: runner.os == 'Linux'
        run: tests/test_ci_plan.sh
