[package]
name = "pom-plugin-hermes"
version = "0.1.0"
license = "MIT"
edition = "2021"
build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[[test]]
name = "contract"
path = "tests/contract.rs"
